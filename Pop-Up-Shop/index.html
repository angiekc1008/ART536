<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Princess Pop-Up Shop</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
        <script src="https://unpkg.com/aframe-extras@7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls/dist/aframe-blink-controls.min.js"></script>

</head>
<body>

    <a-scene>

        <a-entity id="player" position="0 1.6 0">
            <!-- camera -->
            <a-entity id="camera" camera wasd-controls look-controls></a-entity>
            <!-- hand controls -->
            <a-entity id="left-hand" raycaster="objects: .floor" oculus-touch-controls="hand: left" blink-controls></a-entity>
            <a-entity id="right-hand" raycaster="objects: .floor" oculus-touch-controls="hand: right" blink-controls></a-entity>
        </a-entity>

        <a-assets>

            <a-mixin id="wall-short" geometry="primitive: box; width: 8; height: 4; depth: 0.3"></a-mixin>

            <a-mixin id="wall-long" geometry="primitive: box; width: 14; height: 4; depth: 0.3"></a-mixin>

            <a-mixin id="wall-top" geometry="primitive: box; width: 4.3; height:1; depth: 0.3"></a-mixin>

            <a-mixin id="wall-side" geometry="primitive: box; width: 2; height:4; depth: 0.3"></a-mixin>

            <a-mixin id="column" geometry="primitive: cylinder; height: 5; radius: 0.5"></a-mixin>

            <a-mixin id="primary" material="color: white"></a-mixin>

            <a-mixin id="secondary" material="color: #C6C9E2"></a-mixin>

            <a-mixin id="glass" material="color: #C6C9E2; opacity: 0.3"></a-mixin>

            <a-mixin id="solid-orange" material="color: orange"></a-mixin>

            <a-mixin id="blue" material="color: #4c8bc7"></a-mixin>

            <a-mixin id="red" material="color: #990003"></a-mixin>

            <a-mixin id="black" material="color: #000000"></a-mixin>
        

            <a-mixin id="vinyl-cover" geometry="primitive: plane; width: .6; height: .6"></a-mixin>
            <a-mixin id="vinyl" geometry="primitive: ring; radiusOuter: 0.3; radiusInner: 0.02"></a-mixin>

            <a-asset-item id="kp-wordmark" src="/assets/3D/KP-wordmark.gltf"></a-asset-item>
            <a-asset-item id="KPlogo-K" src="/assets/3D/kp-logo-K.gltf"></a-asset-item>
            <a-asset-item id="KPlogo-P" src="/assets/3D/kp-logo-P.gltf"></a-asset-item>
            <a-asset-item id="KPwand" src="/assets/3D/KP-wand.gltf"></a-asset-item>
            <a-asset-item id="cherry" src="/assets/3D/cherry.obj"></a-asset-item>
            <a-asset-item id="pedestal" src="/assets/3D/chrome_pedestal_table.obj"></a-asset-item>
            <a-asset-item id="sculpture" src="/assets/3D/torsosculpture.obj"></a-asset-item>
            <a-asset-item id="drum-chair" src="/assets/3D/drum_throne.obj"></a-asset-item>
            <a-asset-item id="drum-snare" src="/assets/3D/snare_drum.obj"></a-asset-item>
            <a-asset-item id="drum-tom" src="/assets/3D/tom.obj"></a-asset-item>
            <a-asset-item id="drum-floortom" src="/assets/3D/floor_tom.obj"></a-asset-item>
            <a-asset-item id="microphone" src="/assets/3D/microphone_302.obj"></a-asset-item>
            <a-asset-item id="guitar" src="/assets/3D/guitar.obj"></a-asset-item>
            <a-asset-item id="amp" src="/assets/3D/guitar_amplifier.obj"></a-asset-item>
            <a-asset-item id="clothing-rack" src="/assets/3D/single_bar_clothing_rack.obj"></a-asset-item>
            <a-asset-item id="poster-rolled" src="/assets/3D/rolled_up_newspaper_1554.obj"></a-asset-item>
            <a-asset-item id="shelf" src="/assets/3D/shelf_1.obj"></a-asset-item>
            <a-asset-item id="bass-drum" src="/assets/3D/bass_drum.obj"></a-asset-item>
            <a-asset-item id="leg" src="/assets/3D/Display_Leg.obj"></a-asset-item>
            <a-asset-item id="tshirt" src="/assets/3D/plain_t_shirt.obj"></a-asset-item>
            <a-asset-item id="hanger" src="/assets/3D/WoodHanger.obj"></a-asset-item>
            <a-asset-item id="register" src="/assets/3D/register.obj"></a-asset-item>



            <img id="song-titles" src="/assets/images/songtitletexture.jpg">
            <img id="song-titles-red" src="/assets/images/songtitlesred.jpg">
            <img id="cherrymural" src="/assets/images/KP-Cherry-mural.jpg">
            <img id="largemural" src="/assets/images/mural.jpg">
            <img id="floortexture" src="/assets/floor-texture/clean_asphalt_disp_4k.png">
            <img id="girlviolence" src="/assets/album-covers/girlviolence-cover.jpg">
            <img id="holdonbaby" src="/assets/album-covers/holdonbaby-cover.jpg">
            <img id="cheapqueen" src="/assets/album-covers/cheapqueen-cover.jpg">
            <img id="pussyisgod" src="/assets/album-covers/pussyisgod-cover.jpg">
            <img id="pedestal-texture" src="/assets/slate_floor_diff_4k.jpg">
            <img id="checkoutdesk" src="/assets/woodendesk/wood_table_diff_4k.jpg">
            <img id="cherryshirt" src="/assets/images/download.jpg">
            <img id="portraitshirt" src="/assets/images/orange-portrait.jpg">
            <img id="crownshirt" src="/assets/images/download(5).jpg">
            <img id="wifebeatershirt" src="/assets/images/wifebeater.jpg">
            <img id="clashshirt" src="/assets/images/King-Princess-for-Clash-Magazine.jpg">
            <img id="bud" src="/assets/images/King-Princess-For-Budsdigest!.jpg">
            <img id="rollingstones" src="/assets/images/rolling-stone.jpg">
            <img id="pain" src="/assets/images/pain.jpg">

            <video id="KP-MV-Clips" src="/assets/images/KP-MV-Clips.mp4" autoplay loop="true" crossorigin="anonymous"></video>
            <audio id="KP-MV-audio" src="/assets/images/KP-MV-Audio.mp3" preload="auto"></audio>


        </a-assets>

        <!-- lighting -->
        <a-light type="ambient" intensity="1.5" color="#FFF"></a-light>
        <a-light type="point" decay="0.6" position="-3.6 3.8 -4" color="#ffa54d"></a-light>
        <a-light type="point" decay="0.6" position="-3.6 3.8 -8" color="#ffa54d"></a-light>
        <a-light type="point" decay="0.6" position="-3.6 3.8 -13" color="#ffa54d"></a-light>
        <a-light type="point" decay="0.6" position="3.6 3.8 -4" color="#ffa54d"></a-light>
        <a-light type="point" decay="0.6" position="3.6 3.8 -8" color="#ffa54d"></a-light>
        <a-light type="point" decay="0.6" position="3.6 3.8 -13" color="#ffa54d"></a-light>


        <!-- walls and mv -->
        <a-box width="8.35" height="14.25" depth=".25" rotation="-90 0 0" position="0 4.111 -10.5"></a-box>
        <a-entity mixin="wall-short secondary" position="0 2 -17.5"></a-entity>
        <a-plane src="#cherrymural" position="3.84 2.15 -12" scale="4.7 3.15 1" rotation="0 -90 0"></a-plane>
        <a-entity mixin="wall-top glass" position="0 3.5 -3.49"></a-entity>
        <a-entity mixin="wall-side glass" position="-3.15 1.998 -3.49"></a-entity>
        <a-entity mixin="wall-side glass" position="3.15 1.998 -3.49"></a-entity>
        <!-- <a-entity mixin="wall-short secondary" position="0 2 -3.5"></a-entity> commented out for viewing purposes --> 
        <a-entity mixin="wall-long secondary" position="-4 2 -10.35" rotation="0 90 0"></a-entity>
        <a-plane src="#largemural" position="-3.842 2 -10.35" height="4" width="14" rotation="0 90 0"></a-plane>
        <a-entity mixin="wall-long secondary" position="4 2 -10.35" rotation="0 90 0"></a-entity>
        <a-plane class="floor" mixin="solid-orange" width="8" height="14" rotation="-90 0 0" position="0 0 -10.35" material="src:#floortexture; roughness:0.6"></a-plane>
        <a-plane class="floor" width="45" height="45" rotation="-90 0 0" position="0 -.01 0"></a-plane>
        <a-box class="floor" mixin="solid-orange" id="stage" position="0 .25 -16" width="8" height="0.5" depth="3" material="src:#floortexture; roughness:0.6" shadow></a-box>
        <a-video src="#KP-MV-Clips" width="4" height="2" position="0 2.5 -17.25"></a-video>
        <!-- <a-sound src="#KP-MV-audio" position="0 2.5 -17.25" positional="true" distanceModel="exponential" refDistance="2" rolloffFactor="2"></a-sound> -->
    


        <!-- glass insets -->
        <!-- <a-gltf-model src="#kp-wordmark" scale="0.02 0.02 0.02" position="0.1 3.5 -3.668" rotation="0 135 0"></a-gltf-model> -->
        <a-gltf-model src="#KPlogo-K" scale="0.045 0.05 0.045" position="-2.967 1.689 -3.493" rotation="0 -45 0"></a-gltf-model>
        <a-gltf-model src="#KPlogo-P" scale="0.045 0.05 0.045" position="3.037 1.689 -3.493" rotation="0 -45 0"></a-gltf-model>
        <a-gltf-model src="#KPwand" scale="0.06 0.06 0.06" position="-0.04 3.5 -3.50427" rotation="39.794 -6.026 81.147"></a-gltf-model>

        <a-entity id="entry-frame">
            <a-box color="black" material="metalness: 1; roughness: 0.1" position="-2.13 1.508 -3.496" geometry="primitive: box; width: 0.04; height: 3.02; depth: 0.28"></a-box>
            <a-box color="black" material="metalness: 1; roughness: 0.1" position="2.13 1.508 -3.496" geometry="primitive: box; width: 0.04; height: 3.02; depth: 0.28"></a-box>
            <a-box color="black" material="metalness: 1; roughness: 0.1" position="0 3 -3.496" rotation="0 0 90" geometry="primitive: box; width: 0.04; height: 4.3; depth: 0.28"></a-box>
        </a-entity>


        <!-- sculptures -->
        <a-entity position="0 -0.2 1.85" id="cherry-sculpture" position="0 0 0.3">
            <a-obj-model src="#cherry" scale="0.075 0.075 0.075" position="3.175 0.08 -9.5" rortation="0 8.2 0" material="src:#song-titles-red"></a-obj-model>
            <a-obj-model src="#cherry" scale="0.075 0.075 0.075" position="3.175 0.08 -7.9" rotation="0 143 0" material="src:#song-titles-red"></a-obj-model>
        </a-entity>

        <a-entity id="metal-sculpture">
            <a-obj-model src="#sculpture" scale="1.5 1.5 1.5" position="-4.17 0.31 -14.35" rotation="0 90 0" material="metalness: 1; roughness: 0.4;" material.envMap="reflectionCube;"></a-obj-model>
            <a-obj-model src="#pedestal" scale="0.035 0.021 0.035" position="-3.374 0 -13.86" rotation="0 143 0" color="#C6C9E2" material="src:#pedestal-texture; metalness: 0; roughness: 0; "></a-obj-model>
        </a-entity>

        <a-obj-model src="#leg" scale="0.06 0.06 0.06" material="metalness: 1" position="-3.15 0 -4.03" rotation="0 138 0"></a-obj-model>


        <!-- stage setup -->
        <a-obj-model src="#microphone" scale="0.025 0.025 0.025" position="0 1.8 -14.85" color="black" rotation="-37 0 1.7"></a-obj-model>
        <a-cylinder position="0 .5 -15" radius="0.15" height=".05" color="black"></a-cylinder>
        <a-cylinder position="0 1 -15" radius="0.02" height="2" color="black"></a-cylinder>    <!-- microphone -->
        <a-obj-model src="#drum-tom" scale="0.015 0.015 0.015" position="-3.275 0.5 -16" rotation="0 -32.54 0" material="metalness: 1; roughness: 0.2"></a-obj-model>
        <a-obj-model src="#drum-floortom" scale="0.0175 0.0175 0.0175" position="-2.615 0.5 -15.538" material="metalness: 1; roughness: 0.2"></a-obj-model>
        <a-obj-model src="#drum-snare" scale="0.018 0.018 0.018" position="-1.271 0.5 -16" rotation="0 20 0" material="metalness: 1; roughness: 0.2"></a-obj-model>
        <a-obj-model src="#bass-drum" scale="0.015 0.015 0.01" position="-1.854 0.5 -15.735" roation="27.22" material="metalness: 1; roughness: 0.2"></a-obj-model>    <!-- drumset -->
        <a-obj-model src="#drum-chair" scale="0.02 0.015 0.02" position="-2.278 0.5 -16.492" material="metalness: 1; roughness: 0.2"></a-obj-model>    <!-- drumset -->
        <a-obj-model src="#guitar" scale="0.02 0.02 0.02" position="2.471 0.479 -16.509" rotation="-10.066 -57.909 -6.254" material="metalness: 0.5;"></a-obj-model>
        <a-obj-model src="#amp" scale="0.02 0.02 0.02" position="3.1 0.5 -16.55" material="metalness: 0.5; roughness: 0.5" rotation="0 -22.14 0" color="#474747"></a-obj-model>    <!-- guitar + amp -->


        <!-- checkout counter -->
        <a-box position="2.75 .65 -12" geometry="width: 1.05; height: 1.25; depth: 3" src="#checkoutdesk"></a-box>
        <a-obj-model src="#register" position="2.064 0.93 -13.1" rotation="-14.95 -98.365 -0.163" color="#000000"></a-obj-model>


        <!-- posters for sale -->
        <a-entity id="poster-box" position="0 0 0.36">

            <a-box mixin="solid-orange" position="3.45 0.5 -10.7" geometry="width: 0.7; height: 1; depth: 0.1"></a-box>
            <a-box mixin="solid-orange" position="3.45 0.5 -10" geometry="width: 0.7; height: 1; depth: 0.1"></a-box>
            <a-box mixin="solid-orange" position="3.751 0.5 -10.35" geometry="width: 0.1; height: 1; depth: 0.8"></a-box>
            <a-box mixin="solid-orange" position="3.15 0.5 -10.35" geometry="width: 0.1; height: 1; depth: 0.8"></a-box>
            <a-box mixin="solid-orange" position="3.45 0.05 -10.35" geometry="width: 0.7; height: 0.1; depth: 0.8"></a-box>
        
        </a-entity>

        <a-entity position="0 0 0.3">
            <a-obj-model color="#000000" src="#poster-rolled" scale="0.06 0.02 0.02" rotation="-8.07985082693487 2.4259033045839056 -94.14670602251148" position="3.56228 0.44536 -10.40477"></a-obj-model>
            <a-obj-model color="#404040" src="#poster-rolled" scale="0.06 0.02 0.02" rotation="-8.07985082693487 2.4259033045839056 -94.14670602251148" position="3.56228 0.44536 -10.29"></a-obj-model>
            <a-obj-model color="#afafaf" src="#poster-rolled" scale="0.06 0.02 0.02" rotation="-8.025419836397441 0 -90.00021045914971" position="3.50083 0.44536 -10.46639"></a-obj-model>
            <a-obj-model color="#db6060" src="#poster-rolled" scale="0.06 0.02 0.02" rotation="-8.025419836397441 0 -90.00021045914971" position="3.39 0.44536 -10.46639"></a-obj-model>
        </a-entity>
  
        <a-entity position="0 0 0.6">
            <a-obj-model color="#fc7f03" src="#poster-rolled" scale="0.06 0.02 0.02" rotation="8.07985082693487 2.4259033045839056 94.14670602251148" position="3.66853 0.44536 -10.43402"></a-obj-model>
            <a-obj-model color="#000d54" src="#poster-rolled" scale="0.06 0.02 0.02" rotation="8.07985082693487 -2.4259033045839056 94.14670602251148" position="3.56228 0.44536 -10.40"></a-obj-model>
            <a-obj-model color="#001dbf" src="#poster-rolled" scale="0.06 0.02 0.02" rotation="8.025419836397441 0 90.00021045914971" position="3.42062 0.44536 -10.4978"></a-obj-model>
            <a-obj-model color="#262626" src="#poster-rolled" scale="0.06 0.02 0.02" rotation="8.025419836397441 0 90.00021045914971" position="3.381 0.44536 -10.42"></a-obj-model>
        </a-entity>


        <!-- clothes -->
        <a-obj-model src="#clothing-rack" scale="0.018 0.012 0.015" position="-3.3 .002 -8.15" rotation="0 90 0" material="metalness: .75; color: #9e9e9e"></a-obj-model>
        <a-entity>
            <a-obj-model src="#hanger" scale="0.01 0.01 0.01" position="-3.374 1.426 -7.4" rotation="0 33 0" color="#404040"></a-obj-model>
            <a-obj-model src="#tshirt" scale=".015 .015 .05" position="-3.3 .53 -7.324" rotation="0 33 0" color="#ffadad"></a-obj-model>
            <a-plane src="#clashshirt" position="-3.265 1.169 -7.252" rotation="0 33 0" scale=".35 .35 .35"></a-plane>
        </a-entity>
        
        <a-entity>
            <a-obj-model src="#hanger" scale="0.01 0.01 0.01" position="-3.374 1.426 -7.8" rotation="0 33 0" color="#404040"></a-obj-model>
            <a-obj-model src="#tshirt" scale=".015 .015 .05" position="-3.3 .53 -7.724" rotation="0 33 0" color="#000000"></a-obj-model>
            <a-plane src="#portraitshirt" position="-3.265 1.169 -7.652" rotation="0 33 0" scale=".35 .35 .35"></a-plane>
        </a-entity>
        
        <a-entity>
            <a-obj-model src="#hanger" scale="0.01 0.01 0.01" position="-3.374 1.426 -8.2" rotation="0 33 0" color="#404040"></a-obj-model>
            <a-obj-model src="#tshirt" scale=".015 .015 .05" position="-3.3 .53 -8.124" rotation="0 33 0" color="#db6300"></a-obj-model>
            <a-plane src="#wifebeatershirt" position="-3.265 1.169 -8.052" rotation="0 33 0" scale=".35 .35 .35"></a-plane>
        </a-entity>
        
        <a-entity>
            <a-obj-model src="#hanger" scale="0.01 0.01 0.01" position="-3.374 1.426 -8.6" rotation="0 33 0" color="#404040"></a-obj-model>
            <a-obj-model src="#tshirt" scale=".015 .015 .05" position="-3.3 .53 -8.524" rotation="0 33 0" color="#ffffff"></a-obj-model>
            <a-plane src="#crownshirt" position="-3.265 1.169 -8.452" rotation="0 33 0" scale=".35 .35 .35"></a-plane>
        </a-entity>
        
        <a-entity>
            <a-obj-model src="#hanger" scale="0.01 0.01 0.01" position="-3.374 1.426 -9" rotation="0 33 0" color="#404040"></a-obj-model>
            <a-obj-model src="#tshirt" scale=".015 .015 .05" position="-3.3 .53 -8.924" rotation="0 33 0" color="#b10606"></a-obj-model>
            <a-plane src="#cherryshirt" position="-3.265 1.169 -8.852" rotation="0 33 0" scale=".35 .35 .35"></a-plane>
        </a-entity>
        
        <!-- vinyls -->
        <a-entity mixin="vinyl-cover" material="src: #girlviolence" position="3.84 1 -4.4" rotation="0 -90 0"></a-entity>
        <a-entity mixin="vinyl solid-orange" position="3.84 1.66 -4.4" rotation="0 -90 0"></a-entity>

        <a-entity mixin="vinyl-cover" material="src: #holdonbaby" position="3.84 2.5 -4.4" rotation="0 -90 0"></a-entity>
        <a-entity mixin="vinyl red" position="3.84 3.15 -4.4" rotation="0 -90 0"></a-entity>

        <a-entity mixin="vinyl-cover" material="src: #pussyisgod" position="3.84 1 -9.15" rotation="0 -90 0"></a-entity>
        <a-entity mixin="vinyl black" position="3.84 1.66 -9.15" rotation="0 -90 0"></a-entity>

        <a-entity mixin="vinyl-cover" material="src: #cheapqueen" position="3.84 2.5 -9.15" rotation="0 -90 0"></a-entity>
        <a-entity mixin="vinyl blue" position="3.84 3.15 -9.15" rotation="0 -90 0"></a-entity>

        <!-- posters on wall -->
        <a-plane src="#rollingstones" position="3.84 2.5 -8" scale="1 1.3 1" rotation="0 -90 0"></a-plane>
        <a-plane src="#pain" position="3.84 2.5 -6.735" rotation="0 -90 0"></a-plane>
        <a-plane src="#bud" position="3.84 2.5 -5.507" scale="1 1.3 1" rotation="0 -90 0"></a-plane>
        



    </a-scene>
    
</body>
</html>
