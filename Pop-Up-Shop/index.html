<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Princess Pop-Up Shop</title>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>

    <a-scene>

        <a-assets>

            <a-mixin id="wall-short" geometry="primitive: box; width: 8; height: 4; depth: 0.3"></a-mixin>

            <a-mixin id="wall-long" geometry="primitive: box; width: 14; height: 4; depth: 0.3"></a-mixin>

            <a-mixin id="wall-top" geometry="primitive: box; width: 4.3; height:1; depth: 0.3"></a-mixin>

            <a-mixin id="wall-side" geometry="primitive: box; width: 2; height:4; depth: 0.3"></a-mixin>

            <a-mixin id="column" geometry="primitive: cylinder; height: 5; radius: 0.5"></a-mixin>

            <a-mixin id="primary" material="color: white"></a-mixin>

            <a-mixin id="secondary" material="color: #C6C9E2"></a-mixin>

            <a-mixin id="glass" material="color: #C6C9E2; opacity: 0.3"></a-mixin>

            <a-mixin id="solid-orange" material="color: orange"></a-mixin>

            <a-mixin id="solid-orange" material="color: lightblue"></a-mixin>

            <a-mixin id="vinyl-cover" geometry="primitive: plane; width: .6; height: .6"></a-mixin>
            <a-mixin id="vinyl" geometry="primitive: ring; radiusOuter: 0.3; radiusInner: 0.02"></a-mixin>

            <a-asset-item id="kp-wordmark" src="/assets/3D/KP-wordmark.gltf"></a-asset-item>
            <a-asset-item id="KPlogo-K" src="/assets/3D/kp-logo-K.gltf"></a-asset-item>
            <a-asset-item id="KPlogo-P" src="/assets/3D/kp-logo-P.gltf"></a-asset-item>
            <a-asset-item id="KPwand" src="/assets/3D/KP-wand.gltf"></a-asset-item>
            <a-asset-item id="cherry" src="/assets/3D/cherry.obj"></a-asset-item>
            <a-asset-item id="pedestal" src="/assets/3D/chrome_pedestal_table.obj"></a-asset-item>
            <a-asset-item id="sculpture" src="/assets/3D/torsosculpture.obj"></a-asset-item>



            <img id="song-titles" src="/assets/images/songtitletexture.jpg">
            <img id="song-titles-red" src="/assets/images/songtitlesred.jpg">
            <img id="cherrymural" src="/assets/images/KP-Cherry-mural.jpg">
            <img id="largemural" src="/assets/images/mural.jpg">
            <img id="floortexture" src="/assets/floor-texture/clean_asphalt_disp_4k.png">
            <img id="girlviolence" src="/assets/album-covers/girlviolence-cover.jpg">
            <img id="holdonbaby" src="/assets/album-covers/holdonbaby-cover.jpg">
            <img id="cheapqueen" src="/assets/album-covers/cheapqueen-cover.jpg">
            <img id="pussyisgod" src="/assets/album-covers/pussyisgod-cover.jpg">


        </a-assets>

        <a-light type="ambient" intensity="1.5"></a-light>
        <a-light type="directional" position="-3.374 0 -13.86"></a-light>
        <a-light type="point" decay="0.6" position="-3.6 3.8 -4" color="#ffa54d"></a-light>
        <a-light type="point" decay="0.6" position="-3.6 3.8 -8" color="#ffa54d"></a-light>
        <a-light type="point" decay="0.6" position="-3.6 3.8 -13" color="#ffa54d"></a-light>
        <a-light type="point" decay="0.6" position="3.6 3.8 -4" color="#ffa54d"></a-light>
        <a-light type="point" decay="0.6" position="3.6 3.8 -8" color="#ffa54d"></a-light>
        <a-light type="point" decay="0.6" position="3.6 3.8 -13" color="#ffa54d"></a-light>


        <a-entity mixin="wall-short secondary" position="0 2 -17.5" material="src:#cherrymural"></a-entity>
        <a-entity mixin="wall-top glass" position="0 3.5 -3.49"></a-entity>
        <a-entity mixin="wall-side glass" position="-3.15 1.998 -3.49"></a-entity>
        <a-entity mixin="wall-side glass" position="3.15 1.998 -3.49"></a-entity>
        <!-- <a-entity mixin="wall-short secondary" position="0 2 -3.5"></a-entity> commented out for viewing purposes --> 
        <a-entity mixin="wall-long secondary" position="-4 2 -10.35" rotation="0 90 0" material="src:#largemural"></a-entity>
        <a-entity mixin="wall-long secondary" position="4 2 -10.35" rotation="0 90 0"></a-entity>
        <a-plane mixin="solid-orange" width="8" height="14" rotation="-90 0 0" position="0 0 -10.35" material="src:#floortexture; roughness:0.6"></a-plane>
        <a-box mixin="solid-orange" id="stage" position="0 .25 -16" width="8" height="0.5" depth="3" material="src:#floortexture; roughness:0.6" shadow></a-box>
        <a-entity mixin="poster-frame" ></a-entity>

        <!-- <a-gltf-model src="#kp-wordmark" scale="0.02 0.02 0.02" position="0.1 3.5 -3.668" rotation="0 135 0"></a-gltf-model> -->
        <a-gltf-model src="#KPlogo-K" scale="0.045 0.05 0.045" position="-2.967 1.689 -3.493" rotation="0 -45 0"></a-gltf-model>
        <a-gltf-model src="#KPlogo-P" scale="0.045 0.05 0.045" position="3.037 1.689 -3.493" rotation="0 -45 0"></a-gltf-model>
        <a-gltf-model src="#KPwand" scale="0.06 0.06 0.06" position="-0.04 3.5 -3.50427" rotation="39.794 -6.026 81.147"></a-gltf-model>

        <a-entity id="entry-frame">
            <a-box color="black" material="metalness: 1; roughness: 0.1" position="-2.13 1.508 -3.496" geometry="primitive: box; width: 0.04; height: 3.02; depth: 0.28"></a-box>
            <a-box color="black" material="metalness: 1; roughness: 0.1" position="2.13 1.508 -3.496" geometry="primitive: box; width: 0.04; height: 3.02; depth: 0.28"></a-box>
            <a-box color="black" material="metalness: 1; roughness: 0.1" position="0 3 -3.496" rotation="0 0 90" geometry="primitive: box; width: 0.04; height: 4.3; depth: 0.28"></a-box>
        </a-entity>

        <a-entity position="0 -0.2 1.85" id="cherry-sculpture">
            <a-obj-model src="#cherry" scale="0.075 0.075 0.075" position="3.175 0.08 -9.5" rortation="0 8.2 0" material="src:#song-titles-red"></a-obj-model>
            <a-obj-model src="#cherry" scale="0.075 0.075 0.075" position="3.175 0.08 -7.9" rotation="0 143 0" material="src:#song-titles-red"></a-obj-model>
        </a-entity>

        <a-entity id="metal-sculpture">
            <a-obj-model src="#sculpture" scale="1.5 1.5 1.5" position="-4.17 0.31 -14.35" rotation="0 90 0" material="metalness: 1; roughness: 0.4;" material.envMap="reflectionCube;"></a-obj-model>
            <a-obj-model src="#pedestal" scale="0.035 0.021 0.035" position="-3.374 0 -13.86" rotation="0 143 0" material="metalness: 1; roughness: 0.3; "></a-obj-model>
        </a-entity>

        



        <a-entity></a-entity>

        <a-entity mixin="vinyl-cover" material="src: #girlviolence" position="3.84 1 -4.4" rotation="0 -90 0"></a-entity>
        <a-entity mixin="vinyl solid-orange" position="3.84 1.66 -4.4" rotation="0 -90 0"></a-entity>

        <a-entity mixin="vinyl-cover" material="src: #holdonbaby" position="3.84 2.5 -4.4" rotation="0 -90 0"></a-entity>
        <a-entity mixin="vinyl lightblue" position="3.84 3.15 -4.4" rotation="0 -90 0"></a-entity>


        <a-entity mixin="vinyl-cover" material="src: #pussyisgod" position="3.84 1 -9.15" rotation="0 -90 0"></a-entity>
        <a-entity mixin="vinyl solid-orange" position="3.84 1.66 -9.15" rotation="0 -90 0"></a-entity>

        <a-entity mixin="vinyl-cover" material="src: #cheapqueen" position="3.84 2.5 -9.15" rotation="0 -90 0"></a-entity>
        <a-entity mixin="vinyl lightblue" position="3.84 3.15 -9.15" rotation="0 -90 0"></a-entity>



    </a-scene>
    
</body>
</html>
